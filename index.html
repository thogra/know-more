<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Would you like to know more?</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="site-nav">
  <a class="site-nav-link" href="index.html" aria-current="page">Play</a>
  <a class="site-nav-link" href="create.html">Create</a>
</nav>

<main class="page-main">
<div class="stage" id="stage">
  <div class="player-wrap">
    <div id="player"></div>
  </div>

  <div class="shield"></div>

  <div class="overlay" id="overlay">
    <div class="bar-stack">
      <img class="bar" data-bar="blank" src="frames/bar-blank.jpg" alt="">
      <img class="bar" data-bar="full"  src="frames/bar-full.jpg"  alt="">
      <img class="bar" data-bar="blue"  src="frames/bar-blue.jpg"  alt="">
      <a class="bar-link" id="bar-link" target="_blank" rel="noopener noreferrer" aria-label="Know more"></a>
    </div>
  </div>

  <button class="gate" id="gate" type="button">▶ Play</button>
</div>

<div class="error" id="error" hidden>
  <p id="error-message"></p>
  <p class="error-action"><a href="create.html">Make your own link</a></p>
</div>

<div class="welcome" id="welcome" hidden>
  <p class="welcome-action"><a href="create.html">Create a clip</a></p>
</div>
</main>

<section class="gallery">
  <h2 class="gallery-title">Featured clips</h2>

  <div class="gallery-grid">
    <a class="gallery-card" href="./?v=d25cHyaRgVg&amp;start=10&amp;end=17&amp;url=https%3A%2F%2Fen.wikipedia.org%2Fwiki%2FFIFA%23Corruption">
      <img src="https://img.youtube.com/vi/d25cHyaRgVg/hqdefault.jpg" alt="Featured clip 1" loading="lazy">
    </a>
    <a class="gallery-card" href="./?v=v2hCFDuyBTM&amp;start=70&amp;end=84&amp;url=https%3A%2F%2Fen.wikipedia.org%2Fwiki%2FWhite_House_State_Ballroom">
      <img src="https://img.youtube.com/vi/v2hCFDuyBTM/hqdefault.jpg" alt="Featured clip 2" loading="lazy">
    </a>
    <a class="gallery-card" href="./?v=s2BF-ufsoe0&amp;start=1&amp;end=10&amp;url=https%3A%2F%2Fknowyourmeme.com%2Fmemes%2Fevents%2Fkirkversary-kirkiversary">
      <img src="https://img.youtube.com/vi/s2BF-ufsoe0/hqdefault.jpg" alt="Featured clip 3" loading="lazy">
    </a>
    <a class="gallery-card" href="./?v=1giVzxyoclE&amp;start=27&amp;end=36&amp;url=https%3A%2F%2Fwww.imdb.com%2Ftitle%2Ftt0114369%2F">
      <img src="https://img.youtube.com/vi/1giVzxyoclE/hqdefault.jpg" alt="Featured clip 4" loading="lazy">
    </a>
  </div>
</section>

<audio id="sting" src="know-more.mp3" preload="auto"></audio>

<script src="https://www.youtube.com/iframe_api"></script>
<script type="module" src="player.js"></script>

</html>
